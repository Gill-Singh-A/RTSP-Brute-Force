# RTSP Vendor Knowledge Base
#
# Banner signatures, vendor-specific RTSP paths and default credentials.
# Loaded alongside the CSV camera DB; entries here augment (not replace) it.
#
# Schema:
#   vendors:
#     - name: <Canonical vendor name (matches VENDOR_SIGNATURES / CSV DB)>
#       banners: [<substring matched case-insensitively against RTSP Server header>]
#       paths: [<RTSP stream paths; use [CHANNEL] or {channel} for multi-channel>]
#       creds:
#         - [<username>, <password>]

vendors:
  - name: Hikvision
    banners:
      - "Hikvision-Webs"
      - "DVRDVS-Webs"
      - "DNVRS-Webs"
      - "HiIpcam"
      - "IPCamera"
      - "NetDVMS"
    paths:
      - "/Streaming/Channels/[CHANNEL]01"
      - "/Streaming/Channels/[CHANNEL]02"
      - "/Streaming/channels/[CHANNEL]01"
      - "/ISAPI/Streaming/Channels/[CHANNEL]01"
      - "/h264/ch[CHANNEL]/main/av_stream"
      - "/h264/ch[CHANNEL]/sub/av_stream"
      - "/Streaming/Unicast/channels/[CHANNEL]01"
    creds:
      - ["admin", "12345"]
      - ["admin", "admin"]
      - ["admin", ""]

  - name: Dahua
    banners:
      - "Dahua"
      - "DH-"
      - "Amcrest"
      - "DHIP"
    paths:
      - "/cam/realmonitor?channel=[CHANNEL]&subtype=0"
      - "/cam/realmonitor?channel=[CHANNEL]&subtype=1"
      - "/cam/realmonitor?channel=[CHANNEL]&subtype=0&unicast=true&proto=Onvif"
    creds:
      - ["admin", "admin"]
      - ["admin", ""]
      - ["888888", "888888"]
      - ["admin", "admin123"]

  - name: Axis
